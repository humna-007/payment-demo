<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo Store — Stripe Checkout</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 32px;
    max-width: 360px;
    text-align: center;
  }
  .card img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; color: #1a1a1a; }
  p.price { font-size: 24px; font-weight: 700; color: #2a2a2a; margin: 8px 0 20px; }
  button {
    width: 100%;
    padding: 14px;
    background: #635bff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #4f47e0; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .note {
    margin-top: 16px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400" alt="Coffee" />
    <h1>Freshly Roasted Coffee (250g)</h1>
    <p class="price">$12.00</p>
    <button id="checkout-btn">Buy Now</button>
    <p class="note">Test mode — use card 4242 4242 4242 4242, any future date, any CVC.</p>
  </div>

  <script>
    const btn = document.getElementById('checkout-btn');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Redirecting...';
      try {
        const res = await fetch('/api/create-checkout-session', { method: 'POST' });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'Something went wrong');
        }
      } catch (err) {
        alert('Checkout failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Buy Now';
      }
    });
  </script>
</body>
</html>

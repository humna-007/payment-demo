<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Successful</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px;
    max-width: 360px;
  }
  .check {
    font-size: 48px;
    color: #2ecc71;
    margin-bottom: 12px;
  }
  h1 { font-size: 20px; color: #1a1a1a; margin: 0 0 8px; }
  p { color: #666; font-size: 14px; }
  a {
    display: inline-block;
    margin-top: 20px;
    color: #635bff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Payment Successful</h1>
    <p>Thank you for your test purchase. In a real store, this is where you'd trigger an order-confirmation email and update your database.</p>
    <a href="/index.html">← Back to store</a>
  </div>
</body>
</html>
